# changelog-data.yml
rssfeed : "https://raw.githubusercontent.com/AdobeDocs/express-add-ons-docs/refs/heads/main/src/pages/feed.xml"

releases:

  - date: 2026-11-24
    changes:
      - type: improved
        text: "[`currentUser.userId()`](../../references/addonsdk/app-current-user.md#userid) is now deprecated and being enforced. Following the **November 15, 2026** removal date, calling it fails with an error in the following cases:"
        list: |
          Add-ons loaded locally from your development server.
          Add-ons submitted to the marketplace after November 15, 2026 (00:00 UTC).
      - type: improved
        text: "Add-ons submitted on or before that date continue to work, but log a deprecation warning to the browser console. To avoid errors, migrate to [`currentUser.identity()`](../../references/addonsdk/app-current-user.md#identity), which returns the user's SHA-256 hashed canonical `userId` and any associated `legacyIds`. See the [How-to Guide](../learn/how-to/user-info.md) for details."

  - date: 2026-09-07
    changes:
      - type: improved
        text: "The **Large Document Support add-on check** [skill](../learn/platform-concepts/large-document-support.md#large-document-support-checker-skill) is now more capable: it scans your add-on's source directly (no build step or bundling), explains why each finding breaks and shows a before/after fix, can apply the fixes on request, and doubles as a CI or pre-commit gate."
      - type: improved
        text: "[Large Document Support](../learn/platform-concepts/large-document-support.md) concepts and [how-to](../learn/how-to/large-document-support.md) guides have been amended to better clarify how mutating APIs must belong to the [`keepContentActiveDuringAsync()`](../../references/document-sandbox/document-apis/classes/editor.md#keepcontentactiveduringasync) second lambda function."

  - date: 2026-09-01
    changes:
      - type: new
        text: "Connected Enterprise consolidates a user's enterprise profiles into a single profile, which can result in changes to their user ID. A new [`currentUser.identity()`](../../references/addonsdk/app-current-user.md#identity) method in the [`addOnUISdk.app.currentUser`](../../references/addonsdk/app-current-user.md) API returns the user's SHA-256 hashed canonical ID and associated legacy IDs, enabling add-ons to reconcile user data across pre- and post-consolidation profiles. See the updated [How-to Guide](../learn/how-to/user-info.md) for details."
      - type: deprecated
        text: "[`currentUser.userId()`](../../references/addonsdk/app-current-user.md#userid) is soft-deprecated in favor of [`identity()`](../../references/addonsdk/app-current-user.md#identity) and is scheduled for removal on **November 15, 2026**."
      - type: improved
        text: "The `addAudio()` method now supports `audio/mp4` files in addition to the other formats listed in the [FAQ](../support/faq.md#-file-formats--media-support)."
      - type: stabilized
        text: "The [`link()`](../../references/addonsdk/app-document.md#link) method and the [`LinkOptions`](../../references/addonsdk/addonsdk-constants.md) parameter are now stable and no longer require the `experimentalApis` flag in your add-on's `manifest.json`."

  - date: 2026-08-03
    changes:
      - type: stabilized
        text: "The following APIs are now stable and no longer require the `experimentalApis` flag in your add-on's `manifest.json`:"
      - type: stabilized
        text: "[`visitPages()`](../../references/document-sandbox/document-apis/classes/page-list.md#visitpages) and [`keepContentActiveDuringAsync()`](../../references/document-sandbox/document-apis/classes/editor.md#keepcontentactiveduringasync)."
      - type: stabilized
        text: "[`addOnUISdk.app.document.isPresentation()`](../../references/addonsdk/app-document.md#ispresentation)."
      - type: stabilized
        text: "[`editor.createThreadedText()`](../../references/document-sandbox/document-apis/classes/editor.md#createthreadedtext), [`ThreadedTextContentModel.allFrames`](../../references/document-sandbox/document-apis/classes/threaded-text-content-model.md#frames), and [`ThreadedTextList.addFrame()`](../../references/document-sandbox/document-apis/classes/threaded-text-list.md#addframe)."
      - type: improved
        text: "Deprecated APIs (`queueAsyncEdit`, `PageNode.artboards`, `PageNode.allDescendants`, `PageNode.allTextContent`, `PageNode.cloneInPlace`) are removed from the SDK—local builds that still reference them will fail."
      - type: improved
        text: "`visitPages` now shows a modal progress bar during long passes."
      - type: improved
        text: "[Large Document Support](../learn/platform-concepts/large-document-support.md) concepts and [how-to](../learn/how-to/large-document-support.md) guides refreshed for Phase 2."
      - type: new
        text: "**Large Document Support add-on check**—a [skill](../learn/platform-concepts/large-document-support.md#large-document-support-checker-skill) you can run to scan your add-on for affected APIs and unsafe node-reference patterns, as a starting point for assessing impact (always confirm by testing)."
      - text: "**Dark Theme Support**"
      - text: "Adobe Express now supports a **dark theme**, and the [`theme`](../../references/addonsdk/app-ui.md#theme) property and [`themechange`](../../references/addonsdk/app-ui.md#themechange) event report both `\"light\"` and `\"dark\"`. Make your add-on dark-theme ready—add-ons submitted to the marketplace after **August 31, 2026** are rejected if their UI is functionally broken in dark mode."
      - text: "See [Supporting all Themes](../learn/how-to/theme-locale.md#supporting-all-themes) for guidance."
      - text: "**Large Document Support: Phase 2**"
      - text: "[Large Document Support](../learn/platform-concepts/large-document-support.md) has reached **Phase 2**: the new APIs are now stable, the deprecated ones are being removed, and the migration window is open—time to migrate, test, and resubmit."

  - date: 2026-06-18
    changes:
      - type: new
        text: "New [Large Document Support](../learn/platform-concepts/large-document-support.md) concepts guide explaining how Adobe Express will handle large documents in the future, including the active/inactive page model, the `ActivePageNode` hierarchy, compatibility mode, and the phased rollout timeline."
      - type: new
        text: "New [how-to guide](../learn/how-to/large-document-support.md) with recipes for [`visitPages`](../../references/document-sandbox/document-apis/classes/page-list.md#visitpages), [`keepContentActiveDuringAsync`](../../references/document-sandbox/document-apis/classes/editor.md#keepcontentactiveduringasync), replacing deprecated APIs (`queueAsyncEdit`, `PageNode.artboards`, `PageNode.allDescendants`, `PageNode.allTextContent`, `PageNode.cloneInPlace`), and avoiding stale node references."
      - type: improved
        text: "[Manage Pages](../learn/how-to/manage-pages.md)—revised page-iteration examples to be Large Document Support–safe."
      - text: "**Large Document Support**"
      - text: "Adobe Express is evolving to handle documents with a large number of pages. This is a major change that _may_ require you to update your add-on to be compatible with the new model. Read the [Large Document Support](../learn/platform-concepts/large-document-support.md) guide to learn more."

  - date: 2026-05-19
    changes:
      - type: new
        text: "New [Deprecation Policy](../learn/platform-concepts/deprecation-policy.md) guide explaining the API lifecycle from the developer's and user's perspective."

  - date: 2026-03-26
    changes:
      - type: stabilized
        text: "The [`Node.resize()`](../../references/document-sandbox/document-apis/classes/node.md#resize) Document API and related APIs are no longer experimental and no longer require the `experimentalApis` flag in your manifest."
      - type: new
        text: "**Experimental** [`MediaContainerNode.replaceMediaWithEditedImage()`](../../references/document-sandbox/document-apis/classes/media-container-node.md#replacemediawitheditedimage): Replaces the current media with an edited version of the same image while preserving existing filter effects, per-element metadata, and asset provenance (including attribution IDs and Adobe Stock information). Use this instead of `replaceMedia()` when the replacing with a modified version of the original image (e.g., recolored, upscaled)."
      - type: new
        text: "**Experimental** [`ReplaceMediaWithEditedImageOptions`](../../references/document-sandbox/document-apis/interfaces/replace-media-with-edited-image-options.md) interface: Options for `replaceMediaWithEditedImage()`, including the `preserveCutoutFilter` property."

  - date: 2026-03-13
    changes:
      - type: improved
        text: "[Create Renditions](../learn/how-to/create-renditions.md) - Guide now covers [`VisualNode.createRendition()`](../../references/document-sandbox/document-apis/classes/visual-node.md#createrendition), which captures individual elements (shapes, groups, text) as PNG or JPEG from the Document Sandbox. Also documents [`isPresentation()`](../../references/addonsdk/app-document.md#ispresentation) for checking document type before offering PPTX export, which is only available for presentation-type documents."
      - type: improved
        text: "[Use Text](../learn/how-to/use-text.md) - Guide now covers threaded text APIs (`createThreadedText`, [`ThreadedTextList`](../../references/document-sandbox/document-apis/classes/threaded-text-list.md)) for multi-frame text flows, and the [`allTextContent`](../../references/document-sandbox/document-apis/classes/page-node.md#alltextcontent) and [`allDescendants`](../../references/document-sandbox/document-apis/classes/page-node.md#alldescendants) accessors for iterating over text within page or visual node containers."
      - type: improved
        text: "[Use PDF and PowerPoint](../learn/how-to/use-pdf-powerpoint.md) - Guide corrected to use [`importPresentation()`](../../references/addonsdk/app-document.md#importpresentation) method, and clarified that only `.pptx` format is supported (legacy `.ppt` not supported)."

  - date: 2026-02-06
    changes:
      - type: new
        text: "We have added new APIs to generate image rendition of visual nodes directly from the document sandbox."
      - type: new
        text: "**Experimental** [`VisualNode.createRendition()`](../../references/document-sandbox/document-apis/classes/visual-node.md#createrendition) asynchronous method - Generate a rendition of a visual node and its descendants."
      - type: new
        text: "**Experimental** [`CreateRenditionOptions`](../../references/document-sandbox/document-apis/interfaces/create-rendition-options.md) interface - define configuration options for generating renditions."
      - type: new
        text: "**Experimental** [`CreateRenditionResult`](../../references/document-sandbox/document-apis/interfaces/create-rendition-result.md) interface - define the structure of the returned rendition data (e.g., blob, metadata)."
      - type: new
        text: "**Experimental** [`CreateRenditionFormat`](../../references/document-sandbox/document-apis/enumerations/create-rendition-format.md) enumeration - specify supported output formats (e.g., PNG, JPEG, PDF) in the `Constants` namespace."
      - type: new
        text: "**Experimental** [`addOnUISdk.app.document.isPresentation()`](../../references/addonsdk/app-document.md#ispresentation) asynchronous method - Returns `true` if the document is a presentation, `false` if not."

  - date: 2026-01-26
    changes:
      - type: new
        text: "We have added new APIs for threaded text handling across multiple frames, as well as new accessors for retrieving a flattened list of all descendant nodes and text content within the page and visual node containers."
      - type: new
        text: "**Experimental** [`Editor.createThreadedText()`](../../references/document-sandbox/document-apis/classes/editor.md#createthreadedtext) method - Create a [`ThreadedTextNode`](../../references/document-sandbox/document-apis/classes/threaded-text-node.md) for threaded text handling across multiple frames."
      - type: new
        text: "**Experimental** [`ThreadedTextList`](../../references/document-sandbox/document-apis/classes/threaded-text-list.md) class - Represents an ordered list of [`ThreadedTextNode`](../../references/document-sandbox/document-apis/classes/threaded-text-node.md) objects, creating a single, continuous text story across multiple frames."
      - type: new
        text: "**Experimental** [`allDescendants`](../../references/document-sandbox/document-apis/classes/page-node.md#alldescendants) accessor on [`PageNode`](../../references/document-sandbox/document-apis/classes/page-node.md) and [`VisualNode`](../../references/document-sandbox/document-apis/classes/visual-node.md) - Returns a flattened, read-only list of all descendant nodes within the container. For text-based nodes, please use the new `allTextContent` accessor instead."
      - type: new
        text: "**Experimental** [`allTextContent`](../../references/document-sandbox/document-apis/classes/page-node.md#alltextcontent) accessor on [`PageNode`](../../references/document-sandbox/document-apis/classes/page-node.md) and [`VisualNode`](../../references/document-sandbox/document-apis/classes/visual-node.md) - Returns a flattened, read-only list of [`TextContent`](../../references/document-sandbox/document-apis/interfaces/text-content.md) instances from all text-based nodes within the container."
      - type: new
        text: "**Experimental** [`TextContent`](../../references/document-sandbox/document-apis/interfaces/text-content.md) interface - Represents text content data extracted from text-based nodes."
      - type: new
        text: "**Experimental** [`TextFrameAreaGeometry`](../../references/document-sandbox/document-apis/interfaces/text-frame-area-geometry.md) interface - Defines the geometry of a text frame area."
      - type: improved
        text: "**Experimental** [`ThreadedTextContentModel.frames`](../../references/document-sandbox/document-apis/classes/threaded-text-content-model.md#frames) property - Updated to properly support the new threaded text implementation with [`ThreadedTextList`](../../references/document-sandbox/document-apis/classes/threaded-text-list.md)."

  - date: 2026-01-13
    changes:
      - type: new
        text: "New [Add-on Architecture](../learn/platform-concepts/architecture.md) guide with dual-runtime system explanation, SDK imports and usage, and cross-runtime communication patterns."
      - type: new
        text: "New [Add-on Project Anatomy & CLI Templates](../getting-started/addon-project-anatomy.md) guide with add-on project structure, file organization, and template selection for efficient Adobe Express add-on development."
      - type: new
        text: "New [Add-on Development Terminology](../learn/fundamentals/terminology.md) guide with standardized definitions, decision matrices, and troubleshooting for Adobe Express Add-on development terminology."
      - type: new
        text: "New practical usage guide for [Using Add-on UI SDK Constants](../learn/fundamentals/ui-sdk-constants.md), focusing on import patterns, common pitfalls, and solutions for UI SDK constants."
      - type: new
        text: "New practical usage guide for [Using Document Sandbox Constants](../learn/fundamentals/document-sandbox-constants.md) to guide on the use of constants in the Document Sandbox environment, including `colorUtils` integration and practical examples."
      - type: new
        text: "New [\"SDK Fundamentals\"](../learn/fundamentals/terminology.md) section in navigation under \"Learn\" to group terminology and constants usage guides for better discoverability."
      - type: improved
        text: "**Major restructure** of the [Add-on UI SDK Constants Reference](../../references/addonsdk/addonsdk-constants.md)."
      - type: improved
        text: "Improved content and metadata for SEO and AI assistant optimization."
      - type: improved
        text: "**Breaking change:** Removed experimental resize/rescale methods (`rescaleProportionalToWidth()`, `rescaleProportionalToHeight()`, `resizeToFitWithin()`, `resizeToCover()`) and replaced with unified **experimental** [`resize()`](../../references/document-sandbox/document-apis/classes/node.md#resize) method offering more flexible behavior control via [`ResizeBehavior`](../../references/document-sandbox/document-apis/enumerations/resize-behavior.md) options. The [`experimentalApis`](../../references/manifest/index.md#requirements) flag is required."
      - text: "**Adobe Express Developer MCP Server Updates**"
      - text: "The Adobe Express Add-on MCP Server (Beta) has been replaced by the **[Adobe Express Developer MCP Server](./local-development/mcp-server.md)**, which is now officially supported and production ready."
      - text: "It ships under a new npm package (`@adobe/express-developer-mcp`) and supersedes the beta version (`@adobe/express-add-on-dev-mcp`) now deprecated, in all MCP configurations. Learn how to set it up and use it to enhance your development workflow in compatible editors such as Cursor."

  - date: 2025-12-28
    changes:
      - type: new
        text: "**SVG image support** in [`addImage()`](../../references/addonsdk/app-document.md#addimage) - You can now import SVG files (`image/svg+xml`) to the document using the `addImage()` method."
      - type: improved
        text: "[`getSelectedPageIds()`](../../references/addonsdk/app-document.md#getselectedpageids) method **promoted from experimental to stable** - Retrieve the currently selected page IDs in the document. The [`experimentalApis`](../../references/manifest/index.md#requirements) flag is no longer required to use this API."

  - date: 2025-11-29
    changes:
      - type: new
        text: "It's now easier to identify Console logs coming from the CLI or Code Playground, because they automatically include new [helpful prefixes](code-playground-workflow.md#debugging) such as `[Playground: Add-on]`, `[Playground: Script]`, and `[Add-on: <add-on-name>]`."
      - type: new
        text: "Open Add-on testing window with a single click. Bookmark the URL ([https://www.adobe.com/go/addon-cli](https://www.adobe.com/go/addon-cli)) to easily access it later."
      - type: new
        text: "New Express-specific Document API classes: [`ExpressContext`](../../references/document-sandbox/document-apis/classes/express-context.md), [`ExpressEditor`](../../references/document-sandbox/document-apis/classes/express-editor.md), and [`ExpressViewport`](../../references/document-sandbox/document-apis/classes/express-viewport.md), which inherit from the corresponding non-specific Classes."
      - type: new
        text: "New Text classes: [`StandaloneTextContentModel`](../../references/document-sandbox/document-apis/classes/standalone-text-content-model.md) and [`ThreadedTextContentModel`](../../references/document-sandbox/document-apis/classes/threaded-text-content-model.md), representing a complete piece of text content contained within a single [`StandaloneTextNode`](../../references/document-sandbox/document-apis/classes/standalone-text-node.md) or split across multiple [`ThreadedTextNode`](../../references/document-sandbox/document-apis/classes/threaded-text-node.md)s."
      - type: new
        text: "**Experimental** [`ImageRectangleNode.fetchBitmapImage()`](../../references/document-sandbox/document-apis/classes/image-rectangle-node.md#fetchbitmapimage) method - Fetch the bitmap image associated with the image rectangle node."
      - type: new
        text: "**Experimental** [`BitmapImage.data()`](../../references/document-sandbox/document-apis/classes/bitmap-image.md#data) method - Fetch the bitmap image data as a Blob."
      - type: improved
        text: "The `Context.currentPage()` method has moved to the new [`ExpressContext.currentPage()`](../../references/document-sandbox/document-apis/classes/express-context.md#currentpage)."
      - type: improved
        text: "The `Viewport` class has been renamed to [`ExpressViewport`](../../references/document-sandbox/document-apis/classes/express-viewport.md)."
      - text: "**Code Playground Updates**"
      - text: "The Adobe Express Code Playground has received a major update with the release of a new set of features and improvements."
      - text: "Open Code Playground with a single click ([https://www.adobe.com/go/addon-playground](https://www.adobe.com/go/addon-playground)) or find the **Code Playground** button in the top navigation bar of the How-to guides, Hello World!, Code Playground pages, and other sections. You can also bookmark links that point to either the [Script](https://www.adobe.com/go/addon-playground?executionMode=script) or [Add-on](https://www.adobe.com/go/addon-playground) Mode."
      - text: "The Code Playground now supports multiple sessions backed up in the cloud, allowing you to save your work and resume where you left off anywhere. Check out the **More** menu to [manage your sessions](code-playground-workflow.md#session-management) (find, rename, or delete)."
      - text: "Now you can try out the code blocks (e.g. in the [How-to guides](../learn/how-to/use-text.md)) by simply clicking on the **Try in playground** button."
      - text: "The [Code Playground](code-playground.md) documentation has been **updated and split into multiple pages** for better organization."
        list: |
          [Overview](code-playground.md)
          [Script Mode](code-playground-script-mode.md)
          [Add-on Mode](code-playground-addon-mode.md)
          [Workflow & Productivity](code-playground-workflow.md)
          [Troubleshooting](code-playground-troubleshooting.md)

