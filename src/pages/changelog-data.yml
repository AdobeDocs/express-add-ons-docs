      - type: new
        text: "New [FAQ entry](../support/faq.md#chrome-is-blocking-my-local-add-on-development-with-a-local-network-access-permission-prompt-what-should-i-do) with troubleshooting steps for the Chrome Local Network Access permission prompt"
      - type: new
        text: "Added informational alert in the [Browser debugging guide](./local-development/browser.md) to notify Chrome users about the Local Network Access permission requirement"

