  - date: 2025-10-02
    changes:
      - type: new
        text: "New [`ImportAddOnData`](../../references/addonsdk/addonsdk-app.md#importaddondata) parameter support for enhanced metadata tracking on imported media in [`addImage()`](../../references/addonsdk/app-document.md#addimage), [`addVideo()`](../../references/addonsdk/app-document.md#addvideo), [`addAnimatedImage()`](../../references/addonsdk/app-document.md#addanimatedimage), and [`enableDragToDocument()`](../../references/addonsdk/addonsdk-app.md#enabledragtodocument) methods."
      - type: new
        text: "New [Handle Element Selection How-to Guide](../learn/how-to/handle-selection.md) covering selection operations, real-time selection events, UI integration patterns, selection-based actions, and working with locked elements."
      - type: new
        text: "New [Manage Pages How-to Guide](../learn/how-to/manage-pages.md) covering page creation, navigation, and management, positioned in a new **Document Structure** navigation category."
      - type: new
        text: "[`MediaAttributes`](../../references/addonsdk/addonsdk-app.md#mediaattributes) parameter documentation for [`addVideo()`](../../references/addonsdk/app-document.md#addvideo) method."
      - type: improved
        text: "The following how-to guides have been updated with `ImportAddOnData` support for enhanced metadata tracking on imported media, including examples and implementation patterns:"
      - type: improved
        text: "[Use Images](../learn/how-to/use-images.md)"
      - type: improved
        text: "[Use Videos](../learn/how-to/use-videos.md)"
      - type: improved
        text: "[Drag and Drop](../learn/how-to/drag-and-drop.md)"
      - type: improved
        text: "[Element Metadata](../learn/how-to/element-metadata.md)"

  - date: 2025-09-10
    changes:
      - type: new
        text: "New Text Replacement APIs: [`appendText()`](../../references/document-sandbox/document-apis/classes/text-node-content-model.md#appendtext), [`deleteText()`](../../references/document-sandbox/document-apis/classes/text-node-content-model.md#deleteText), [`insertText()`](../../references/document-sandbox/document-apis/classes/text-node-content-model.md#insertText), and [`replaceText()`](../../references/document-sandbox/document-apis/classes/text-node-content-model.md#replaceText)."
      - type: new
        text: "**IMPORTANT:** The Text Replacement APIs are currently **_experimental only_** and should not be used in any add-ons you will be distributing until they have been declared stable. To use these APIs, you will first need to set the `experimentalApis` flag to `true` in the [`requirements`](../../references/manifest/index.md#requirements) section of the `manifest.json`."
      - type: new
        text: "New [`mediaAddOnData`](../../references/document-sandbox/document-apis/classes/image-rectangle-node.md#mediaAddOnData) to support additional metadata on the `ImageRectangleNode`."
      - type: new
        text: "New `link` property in Character Style ranges [`CharacterStylesInput`](../../references/document-sandbox/document-apis/interfaces/character-styles-input.md#link) to support hyperlinks."
      - type: new
        text: "The [Use Text](../learn/how-to/use-text.md) guide has been updated to include the new Text APIs."
      - type: new
        text: "The [Use Images](../learn/how-to/use-images.md) guide has been updated to include a `replaceMedia()` example."
      - type: improved
        text: "Renamed `clone()` to [`cloneInPlace()`](../../references/document-sandbox/document-apis/classes/node.md#cloneInPlace)."
      - type: improved
        text: "**IMPORTANT:** The [`cloneInPlace()`](../../references/document-sandbox/document-apis/classes/node.md#cloneInPlace) method is currently **_experimental only_** and should not be used in any add-ons you will be distributing until it has been declared stable. To use this method, you will first need to set the `experimentalApis` flag to `true` in the [`requirements`](../../references/manifest/index.md#requirements) section of the `manifest.json`."
      - type: improved
        text: "Updated [`maskShape`](../../references/document-sandbox/document-apis/classes/grid-cell-node.md#maskShape) in `GridCellNode` to readonly."
      - type: improved
        text: "The [`BitmapImage`](../../references/document-sandbox/document-apis/classes/bitmap-image.md) has been converted from an interface to a class."

  - date: 2025-09-01
    changes:
      - type: new
        text: "Introduced a new [guide](../getting-started/local-development/mcp-server.md) with the release of our public beta **Adobe Express Add-on MCP Server**."
      - type: new
        text: "With MCP-enabled IDEs (Cursor, Claude Desktop, VS Code etc.), developers can [connect to the Adobe Express Add-on MCP Server (Beta)](../getting-started/local-development/mcp-server.md) to accelerate their add-on development with contextually-aware responses and reduced hallucinations from their AI-assistants."

  - date: 2025-08-25
    changes:
      - type: new
        text: "New experimental [`getSelectedPageIds()`](../../references/addonsdk/app-document.md#getselectedpageids) method to the [`addOnUISdk.app.document`](../../references/addonsdk/app-document.md) API. This method retrieves the currently selected page IDs in the document, useful for getting metadata or performing operations on only the pages that the user has selected."
      - type: new
        text: "New [`PptxRenditionOptions`](../../references/addonsdk/app-document.md#pptxrenditionoptions) object for PPTX export support in the [`createRenditions()`](../../references/addonsdk/app-document.md#createrenditions) API. PPTX export is only available for presentation-type documents in Adobe Express."
      - type: new
        text: "New [`RenditionFormat.pptx`](../../references/addonsdk/addonsdk-constants.md) constant added to support PowerPoint presentation export format with MIME type `\"application/vnd.openxmlformats-officedocument.presentationml.presentation\"`."
      - type: improved
        text: "[Page Metadata how-to guide](../learn/how-to/page-metadata.md) with documentation and examples for the new experimental `getSelectedPageIds()` method, including usage patterns for getting metadata of only selected pages."
      - type: improved
        text: "[Create Renditions how-to guide](../learn/how-to/create-renditions.md) with comprehensive PPTX export support documentation, including developer guidance about font differences and content limitations when exporting to PowerPoint format."
      - type: improved
        text: "[Add-on Iframe Context guide](../learn/platform-concepts/context.md) with additional permissions documentation, including details about `oauth`, `clipboard`, `microphone`, and `camera` permissions beyond the existing sandbox permissions."
      - type: improved
        text: "[FAQ](../support/faq.md) with a new comprehensive entry about available add-on permissions and their configuration, plus updated supported file formats for imported content organized by category (Image, Design, Video, Audio)."

  - date: 2025-08-14
    changes:
      - type: new
        text: "The [Code Playground](code-playground.md) now includes a download feature that allows developers to export their playground code as a zip file containing both the add-on folder structure and a standalone script file. This enables seamless transition from prototyping in the playground to local development using the CLI."

  - date: 2025-07-27
    changes:
      - type: new
        text: "New [`isAnonymousUser()`](../../references/addonsdk/app-current-user.md#isanonymoususer) method to the [`addOnUISdk.app.currentUser`](../../references/addonsdk/app-current-user.md) API. This method returns a boolean indicating whether the current user is browsing as a guest (not logged in)."
      - type: new
        text: "New [`exportAllowed()`](../../references/addonsdk/app-document.md#exportallowed) method added to the [`addOnUISdk.app.document`](../../references/addonsdk/app-document.md) API. This method determines whether the current document can be exported based on its review status in collaborative review and approval workflows."
      - type: new
        text: "Enhanced [`importPdf()`](../../references/addonsdk/app-document.md#importpdf) method now supports a [`SourceMimeTypeInfo`](../../references/addonsdk/app-document.md#sourcemimetypeinfo) parameter. When your add-on converts Word documents (`.docx`) or Google Docs (`.gdoc`) to PDF before importing, you can now specify the original file's mime type to improve the user experience."
      - type: new
        text: "Enhanced drag-and-drop functionality with [`SourceMimeTypeInfo`](../../references/addonsdk/addonsdk-app.md#dragcompletiondata) support."
      - type: new
        text: "New [`fileSizeLimit`](../../references/addonsdk/addonsdk-constants.md) and [`fileSizeLimitUnit`](../../references/addonsdk/addonsdk-constants.md) properties added to the [`PngRenditionOptions`](../../references/addonsdk/app-document.md#pngrenditionoptions) object."
      - type: new
        text: "New [`bitRate`](../../references/addonsdk/addonsdk-constants.md) and [`frameRate`](../../references/addonsdk/addonsdk-constants.md) properties added to the [`Mp4RenditionOptions`](../../references/addonsdk/app-document.md#mp4renditionoptions) object."
      - type: improved
        text: "[User Info guide](../learn/how-to/user-info.md) with guidance on handling logged out users (browsing as a guest), with important considerations and limitations."
      - type: improved
        text: "[Create Renditions guide](../learn/how-to/create-renditions.md) to include proactive export permission checking using `exportAllowed()` before creating renditions with `RenditionIntent.export` or `RenditionIntent.print`. The guide now demonstrates graceful fallback to preview renditions when export is restricted."
      - type: improved
        text: "[PDF and PowerPoint guide](../learn/how-to/use-pdf-powerpoint.md) with information about the `sourceMimeType` parameter for improved UX when importing converted documents."
      - type: improved
        text: "[Drag-and-Drop guide](../learn/how-to/drag-and-drop.md) with examples of using `sourceMimeType` when dragging converted documents."
      - type: improved
        text: "The [Grids add-on tutorial](../learn/how-to/tutorials/grids-addon.md) has been updated to use the Adobe Express native [Color Picker](../../references/ui-components/color-picker.md) instead of the hidden `<input>` element workaround."

  - date: 2025-07-25
    changes:
      - type: new
        text: "The Text API has been updated to include Super/SubScript via the `baselineShift` property of the [CharacterStyles](../../references/document-sandbox/document-apis/interfaces/character-styles.md) interface. The corresponding [TextScriptStyle](../../references/document-sandbox/document-apis/enumerations/text-script-style.md) enumerable has been added. The new API has been introduced as stable."
      - type: new
        text: "A new [`cloneInPlace()`](../../references/document-sandbox/document-apis/classes/node.md#cloneInPlace) method has been added to the [Node](../../references/document-sandbox/document-apis/classes/node.md) class and propagated to all its subclasses, which allows you to clone a node and all its children. This new API is still experimental, and requires the `experimentalApis` flag to be set to `true` in the add-on's `manifest.json`."
      - type: new
        text: "New [`MediaRectangleNode`](../../references/document-sandbox/document-apis/classes/media-rectangle-node.md), a base class for a rectangular node that represents the _uncropped_ media within a [`MediaContainerNode`](../../references/document-sandbox/document-apis/classes/media-container-node.md)."
      - type: new
        text: "New [`UnknownMediaRectangleNode`](../../references/document-sandbox/document-apis/classes/unknown-media-rectangle-node.md), a subclass of [`MediaRectangleNode`](../../references/document-sandbox/document-apis/classes/media-rectangle-node.md) for cases where the media type is not yet supported by the API."

  - date: 2025-07-11
    changes:
      - type: new
        text: "New [Markdown Parser add-on tutorial](../learn/how-to/tutorials/markdown-parser-text-api.md) covering the Text API, while building from scratch an add-on capable of parsing Markdown files and converting them into rich text directly within an Adobe Express document."
      - type: new
        text: "New [Resize and Rescale Elements](../learn/how-to/resize-elements.md) how-to guide, which covers the new Resize/Rescale APIs, and provides examples and code snippets."

  - date: 2025-06-19
    changes:
      - type: new
        text: "The [Page Metadata API](../../references/addonsdk/app-document.md#pagemetadata) now includes new properties to detect audio, video, and animated content on pages. You can retrieve duration information for pages with temporal content (such as timelines). We've also updated the [how-to guide](../learn/how-to/page-metadata.md) to cover these new capabilities."

  - date: 2025-06-06
    changes:
      - type: improved
        text: "Enhanced monetization guidelines documentation in the [Public add-on Distribution guide](../build/distribute/public-dist.md#step-8-enter-the-monetization-details) with additional clarity on Adobe's requirements and recommendations for monetizing add-ons. Developers are encouraged to carefully review the updated [monetization guidelines](../build/distribute/guidelines/monetization.md) for the latest information."

  - date: 2025-05-27
    changes:
      - type: new
        text: "Four new Resize/Rescale APIs have been added to the [Node](../../references/document-sandbox/document-apis/classes/node.md) class as experimental features:"
        list: |
          `rescaleProportionalToHeight()`
          `rescaleProportionalToWidth()`
          `resizeToCover()`
          `resizeToFitWithin()`
      - type: new
        text: "[`Editor.createText()`](../../references/document-sandbox/document-apis/classes/editor.md#createtext) now accepts a String parameter, which sets the text content of the new node. The use without a parameter is deprecated."
      - type: new
        text: "[`TextNode`](../../references/document-sandbox/document-apis/classes/text-node.md) is now an abstract base class with two specialized subclasses:"
        list: |
          [StandaloneTextNode](../../references/document-sandbox/document-apis/classes/standalone-text-node.md): displays text in a single frame.
          [ThreadedTextNode](../../references/document-sandbox/document-apis/classes/threaded-text-node.md): supports text that can flow across multiple frames.

  - date: 2025-05-26
    changes:
      - type: new
        text: "Added support for retrieving published (shared) document links via the new [`LinkOptions`](../../references/addonsdk/addonsdk-constants.md) enumerable in [`addOnUISdk.app.document.link()`](../../references/addonsdk/app-document.md#link), along with the `documentPublishedLinkAvailable` event, which is triggered when the published link becomes available. Both updates are reflected in the [Document Metadata How-to Guide](../learn/how-to/document-metadata.md)."
      - type: new
        text: "**IMPORTANT:** The [`link()`](../../references/addonsdk/app-document.md#link) method, the [`LinkOptions`](../../references/addonsdk/addonsdk-constants.md) parameter and the associated link events are currently **_experimental only_** and should not be used in any add-ons you will be distributing until they have been declared stable. To use this method, you will first need to set the `experimentalApis` flag to `true` in the [`requirements`](../../references/manifest/index.md#requirements) section of the `manifest.json`."
      - type: improved
        text: "[`@adobe-ccwebext/ccweb-add-on-sdk-types`](https://github.com/adobe/create-ccweb-add-on/releases): Type Definitions for the CLI have been updated to version `1.17.0`."

  - date: 2025-05-16
    changes:
      - type: improved
        text: "We’ve **completely revamped the information architecture** of the site! 🎉 The new structure is designed to make content easier to navigate, whether you’re just getting started or you’ve been building add-ons for a while. This update aims to reduce friction, surface what matters most, and help both newcomers and experienced developers find their way faster. Among the changes, we have:"
        list: |
          Rebuilt the Guides navigation from scratch, and grouped the content in new sections (Getting Started, Learn, Build, Support).
          Introduced a new [Developer Journey](developer-journey.md) page.
          Rewritten and improved the QuickStart guide, now [Hello, World!](hello-world.md)
          Moved the Tutorials as [Complete Projects](../learn/how-to/tutorials/index.md) within the [How To Guides](../learn/how-to/index.md), now more visible.
          Regrouped content into the new [Platform Concepts](../learn/platform-concepts/context.md) and [Advanced Topics](../build/advanced-topics/frameworks-libraries-bundling.md) sections.
          Updated screenshots, added animations, and enhanced the overall site usability.
      - type: improved
        text: "**Note:** with the new site structure, some of your bookmarks may be broken. We'll set redirects for the most common links, but please check and update them."
      - type: improved
        text: "We're constantly thinking about ways to improve the developer experience; there is more to come, stay tuned and reach out if you want to share your thoughts!"
      - type: improved
        text: "**New OAuth2 redirect URI:**"
      - type: improved
        text: "As part of the sunsetting of the legacy version, Adobe Express has moved from the `new.express.adobe.com` domain to `express.adobe.com`."
      - type: improved
        text: "While there are redirects in place, please **add** `https://express.adobe.com/static/oauth-redirect.html` **to the list of allowed redirect URIs** in your OAuth provider configuration in addition to the existing `https://new.express.adobe.com/static/oauth-redirect.html`. For more details, see the [OAuth2 guide](../learn/how-to/oauth2.md#login-and-logout-flows)."

  - date: 2025-05-07
    changes:
      - type: new
        text: "New [Using Lit & TypeScript Guide](../learn/how-to/tutorials/using-lit-typescript.md) to help developers understand and use Lit and TypeScript in their add-ons."

  - date: 2025-05-05
    changes:
      - type: improved
        text: "There are a few notable changes regarding the [Color Picker APIs](../../references/addonsdk/addonsdk-app.md#showcolorpicker), which have now moved to stable:"
        list: |
          The `initialColor` parameter now accepts a string in `"#RRGGBB[AA]"` format, in addition to the previous HEX number `0xRRGGBB[AA]`—both with optional alpha channel.
          We fixed the return value of the `ColorPickerEvent.colorChange` event, which now correctly handles the color with or without the alpha channel, depending on the value of the `disableAlphaChannel` parameter.
          **Breaking change**: the `ColorPickerEvents` enum has been renamed to `ColorPickerEvent` (singular).
      - type: improved
        text: "Renamed the TextType enumerable to [`TextLayout`](../../references/document-sandbox/document-apis/enumerations/text-layout.md) in the Text APIs."

  - date: 2025-04-22
    changes:
      - type: improved
        text: "The [Code Playground](code-playground.md) documentation has been updated with details about the new [Script Mode](code-playground-script-mode.md#how-to-use-script-mode) and [Local Persistence](code-playground-workflow.md) features, as well as additional details around existing features. The updates include:"
        list: |
          New sections explaining Script Mode and Add-on Mode.
          Detailed descriptions of the different tabs available in the Add-on mode and what type of code belongs in each.
          Information about local persistence and session management.
          Additional guidance on transitioning code between modes.
          New keyboard shortcuts for improved productivity.

  - date: 2025-04-10
    changes:
      - type: new
        text: "New [`link()`](../../references/addonsdk/app-document.md#link) method added to the `addOnUISdk.app.document` reference and [Document Metadata How-to Guide](../learn/how-to/document-metadata.md). This method retrieves the document link and triggers a `documentLinkAvailable` event when the link is available."
      - type: new
        text: "New [vue-starter](../learn/samples.md#vue-starter) sample add-on to help developers get started using Vue.js in their add-ons."
      - type: new
        text: "Fixes `fromRGB()` method reference in the [Using Color How-to](../learn/how-to/use-color.md)."

  - date: 2025-04-03
    changes:
      - type: new
        text: "A new [`hasUnavailableFonts()`](../../references/document-sandbox/document-apis/classes/text-content-model.md#hasunavailablefonts) method is added to [`TextContentModel`](../../references/document-sandbox/document-apis/classes/text-content-model.md) class, which returns true if the text contains any fonts unavailable to the current user."
      - type: new
        text: "**IMPORTANT:** The [`hasUnavailableFonts()`](../../references/document-sandbox/document-apis/classes/text-content-model.md#hasunavailablefonts) is currently **_experimental only_** and should not be used in any add-ons you will be distributing until it has been declared stable. To use this method, you will first need to set the `experimentalApis` flag to `true` in the [`requirements`](../../references/manifest/index.md#requirements) section of the `manifest.json`."
      - type: improved
        text: "The CLI has been updated with the following package versions:"
      - type: improved
        text: "`@adobe/ccweb-add-on-manifest`: 3.0.0"
      - type: improved
        text: "`@adobe/create-ccweb-add-on`: 3.0.0"
      - type: improved
        text: "`@adobe/ccweb-add-on-scaffolder`: 3.0.0"
      - type: improved
        text: "`@adobe/ccweb-add-on-analytics`: 3.0.0"
      - type: improved
        text: "`@adobe/ccweb-add-on-core`: 3.0.0"
      - type: improved
        text: "`@adobe/ccweb-add-on-scripts`: 3.0.0"
      - type: improved
        text: "`@adobe/ccweb-add-on-ssl`: 3.0.0"
      - type: improved
        text: "`@adobe/ccweb-add-on-sdk-types`: 1.14.0"
      - type: improved
        text: "**IMPORTANT:** As a result of the above, please be aware of the following:"
      - type: improved
        text: "Node-related tooling requirements are now:"
      - type: improved
        text: "Minimum `node` version: 18"
      - type: improved
        text: "Minimum `npm` version: 10"
      - type: improved
        text: "SSL Certificates:"
      - type: improved
        text: "SSL for hosting add-ons is now managed from the following locations:"
      - type: improved
        text: "Mac: `/Users/[user]/Library/Application Support/Adobe/CCWebAddOn/devcert`"
      - type: improved
        text: "Windows: `C:\\Users\\Administrator\\AppData\\Local\\Adobe\\CCWebAddOn\\devcert`"
      - type: improved
        text: "After updating `@adobe/ccweb-add-on-scripts` to `3.0.0`, developers will be asked to re-create their SSL certificate."
      - type: improved
        text: "For a new add-on created using `npx @adobe/create-ccweb-add-on@3.0.0`, a new SSL certificate will be set up one-time."
      - type: improved
        text: "For removing expired SSL certificate or certificate authority, developers can now run: `npx @adobe/ccweb-add-on-ssl purge`, and re-create them using `npx @adobe/ccweb-add-on-ssl setup --hostname localhost`"
      - type: improved
        text: "Spectrum Web Components"
      - type: improved
        text: "The version of `@swc-react` components in the templates based on React has been updated to `1.0.3`."
      - type: improved
        text: "The version of `@spectrum-web-components` components in the templates based on SWC has been updated to `1.1.2`."
      - type: improved
        text: "The theme usage has been updated to use the `system` attribute instead of `theme`, ie:"
        list: |
          SWC: `<sp-theme system="express" color="light"  scale="medium">`
          React: `<Theme system="express" scale="medium" color="light">`

  - date: 2025-03-21
    changes:
      - type: new
        text: "A native Color Picker is available to add-ons via the [`showColorPicker()`](../../references/addonsdk/addonsdk-app.md#showcolorpicker) and [`hideColorPicker()`](../../references/addonsdk/addonsdk-app.md#hidecolorpicker) methods of the `addOnUiSdk.app` object."
      - type: new
        text: "We've updated the [Use Color](../learn/how-to/use-color.md) How-to guide, now including a few examples on the Color Picker."
      - type: new
        text: "A [new section](../../references/ui-components/color-picker.md) has been added to the documentation, which provides a reference for the Adobe Express built-in UI components available to add-ons, like the Color Picker."
      - type: new
        text: "A new version of the `@adobe/ccweb-add-on-sdk-types` package (v1.14.0) has been released for the CLI. Run `npm update` from the root of your add-on project to update to get the latest typings."

  - date: 2025-03-07
    changes:
      - type: new
        text: "A new [How-to](../learn/how-to/index.md) section replaces the old Use Cases, expanding it to include more detailed guides on specific topics, like using Text, Color, or Geometry. Each guide includes a brief description, example code snippets, and links to relevant API references."

  - date: 2025-03-06
    changes:
      - type: new
        text: "An [FAQ item](../support/faq.md#why-is-the-cli-failing-with-an-invalid-url-error-when-creating-a-new-add-on-on-windows) was added for a known issue found where the CLI is failing on Windows when running certain versions of Node.js. The [FAQ](../support/faq.md#why-is-the-cli-failing-with-an-invalid-url-error-when-creating-a-new-add-on-on-windows) provides a workaround for this issue."
      - type: new
        text: "The following new properties have been added to the AddOnSdk [`PageMetadata`](../../references/addonsdk/app-document.md#pagemetadata) API:"
        list: |
          [`isBlank`](../../references/addonsdk/app-document.md#pagemetadata): Allows you to check if a page is blank.
          [`templateDetails`](../../references/addonsdk/app-document.md#pagemetadata): Retrieves details about the template used to create the document.
      - type: new
        text: "A new [`runPrintQualityCheck`](../../references/addonsdk/app-document.md#runprintqualitycheck) method has been added to the AddOnSdk [`App.Document`](../../references/addonsdk/app-document.md) API, which allows you to run a print quality check on the document to ensure that it meets print quality standards."
      - type: new
        text: "**IMPORTANT:** The [`runPrintQualityCheck()`](../../references/addonsdk/app-document.md#runprintqualitycheck) is currently **_experimental only_** and should not be used in any add-ons you will be distributing until it has been declared stable. To use this method, you will first need to set the `experimentalApis` flag to `true` in the [`requirements`](../../references/manifest/index.md#requirements) section of the `manifest.json`."

  - date: 2025-03-04
    changes:
      - type: changed
        text: "Stabilized the following HLAPI's:"
        list: |
          The [TextNode](../../references/document-sandbox/document-apis/classes/text-node.md) API's.
          The [fromPostscriptName()](../../references/document-sandbox/document-apis/classes/fonts.md#fromPostscriptName) API of [Fonts](../../references/document-sandbox/document-apis/classes/fonts.md) class.
          The [TextContentModel](../../references/document-sandbox/document-apis/classes/text-content-model.md) APIs like [`TextContentModel.characterStyleRanges`](../../references/document-sandbox/document-apis/classes/text-content-model.md#characterstyleranges). The [`experimentalApis`](../../references/manifest/index.md#requirements) flag is no longer required to use these APIs.

  - date: 2025-03-03
    changes:
      - type: changed
        text: "The Per Element Metadata APIs have been stabilized. You can refer to the [AddOnData](../../references/document-sandbox/document-apis/classes/add-on-data.md) class for details. The [`experimentalApis`](../../references/manifest/index.md#requirements) flag is no longer required to use these APIs."
      - type: changed
        text: "The Selection Change Notification Events APIs have been stabilized. You can refer to the [Context](../../references/document-sandbox/document-apis/classes/context.md) class, which provides two methods: [`on()`](../../references/document-sandbox/document-apis/classes/context.md#on) and [`off()`](../../references/document-sandbox/document-apis/classes/context.md#off). These methods allow you to register and un-register notifications for selection changes and selection properties changes. The [`experimentalApis`](../../references/manifest/index.md#requirements) flag is no longer required to use these APIs."

  - date: 2025-02-26
    changes:
      - type: new
        text: "Icon Size Requirement: The uploaded icon must be 144 px."
      - type: new
        text: "Auto-Resizing: Once uploaded, the icon will be automatically resized to:"
        list: |
          Minimized Add-on Module Icon: 36 px
          Panel Header Icon: 64 px
          Launchpad Icon: 144 px
      - type: new
        text: "**API `paragraphStyleRanges`**"
      - type: new
        text: "Added new [`TextContentModel.paragraphStyleRanges`](../../references/document-sandbox/document-apis/classes/text-content-model.md#paragraphstyleranges),i.e. ParagraphStyles API as experimental, to apply styles to different paragraphs of text content."
      - type: changed
        text: "Stabilized [`registerIframe()`](../../references/addonsdk/addonsdk-app.md#registeriframe) and [`openEditorPanel()`](../../references/addonsdk/app-ui.md#openeditorpanel) APIs. The [`experimentalApis`](../../references/manifest/index.md#requirements) flag is no longer required to utilize these APIs."

  - date: 2025-02-17
    changes:
      - type: improved
        text: "Starting February 17, 2025: Listings will not be visible in the European Union unless trader information is provided."
      - type: improved
        text: "Compliance: Trader information will be displayed publicly on listing detail pages to comply with EU Digital Services Act (DSA) regulations."
      - type: improved
        text: "[Add trader details now.](https://express.adobe.com/add-ons?mode=submission)"
      - type: fixed
        text: "Fixed an issue where the `addAnimatedImage()` API was not working as expected."
      - type: fixed
        text: "Fixed the technical requirements for GIF; the maximum resolution is 1080px."

  - date: 2025-01-27
    changes:
      - type: changed
        text: "Stabilized [`importPdf()`](../../references/addonsdk/app-document.md#importpdf) and [`importPresentation()`](../../references/addonsdk/app-document.md#importpresentation) APIs. The [`experimentalApis`](../../references/manifest/index.md#requirements) flag is no longer required to utilize these APIs."

  - date: 2025-01-17
    changes:
      - type: new
        text: "A new [`Viewport`](../../references/document-sandbox/document-apis/classes/express-viewport.md) class has been added to the Document APIs. `Viewport` represents the canvas area currently visible on-screen."
      - type: new
        text: "A new API [`bringIntoView`](../../references/document-sandbox/document-apis/classes/express-viewport.md#bringIntoView) have been added which adjusts the viewport to make the node's bounds visible on-screen, assuming all bounds are within the artboard bounds."

  - date: 2025-01-13
    changes:
      - type: new
        text: "Adds a new section in [Listing Your Add-on guidelines](../build/distribute/guidelines/general/listing.md) which describes how to [add trader details](../build/distribute/guidelines/general/listing.md#trader-details) in the publisher profile."
      - type: new
        text: "**Are you an existing developer?**"
      - type: new
        text: "You must provide trader details by February 16, 2025, to keep your add-on visible and available in Adobe Express for users in the European Union as of February 17, 2025. This trader information will be displayed publicly on your listing detail pages when viewed from EU countries."
      - type: new
        text: "[Add trader details now.](https://express.adobe.com/add-ons?mode=submission)"

  - date: 2024-11-04
    changes:
      - type: new
        text: "Adds a new [Cross-origin Isolation Handling](../build/advanced-topics/coi.md) page which describes an upcoming change to how Adobe Express enforces cross-origin isolation, and the impact it may have on current add-ons, as well as those currently in-development."
      - type: new
        text: "Updates the descriptions for the [`importPdf()`](../../references/addonsdk/app-document.md#importpdf) and [`importPresentation()`](../../references/addonsdk/app-document.md#importpresentation) functions to clarify that when used, the associated PDF or presentation file will be imported as a new Adobe Express document."

  - date: 2024-10-08
    changes:
      - text: "Adds a brand new version of the [UX Guidelines](../build/design/ux-guidelines/introduction.md) for Adobe Express add-ons."
      - text: "Removes the experimental warnings for [`addAnimatedImage()`](../../references/addonsdk/app-document.md#addanimatedimage) since it is now stable."
      - text: "Adds the `author` property to [`MediaAttributes`](../../references/addonsdk/app-document.md#mediaattributes) to allow it to be used with the [`addAudio()`](../../references/addonsdk/app-document.md#addaudio) API."

  - date: 2024-09-30
    changes:
      - type: new
        text: "Added many new **Text APIs** for improved text management."
        list: |
          [`TextNode.fullContent`](../../references/document-sandbox/document-apis/classes/text-node.md#fullcontent) accessor: returns the [`TextContentModel`](../../references/document-sandbox/document-apis/classes/text-content-model.md) containing the complete text string and its styles associated to the Text Flow (Threaded Text or Overflow Text).
          [`TextNode.nextTextNode`](../../references/document-sandbox/document-apis/classes/text-node.md#nexttextnode) accessor: gets the next node that overflowing text will spill into.
          [`TextNode.layout`](../../references/document-sandbox/document-apis/classes/text-node.md#layout) accessor: gets and sets the [`TextType`](../../references/document-sandbox/document-apis/enumerations/text-layout.md) of the text node frame.
          [`TextNode.visualEffects`](../../references/document-sandbox/document-apis/classes/text-node.md#visualeffects) accessor: list of [`VisualEffectType`](../../references/document-sandbox/document-apis/enumerations/visual-effect-type.md) applied to the text node.
          [`TextContentModel.characterStyleRanges`](../../references/document-sandbox/document-apis/classes/text-content-model.md#characterstyleranges) accessor: list of [character style](../../references/document-sandbox/document-apis/interfaces/character-styles.md) ranges in the text content, controlling the [`color`](../../references/document-sandbox/document-apis/interfaces/character-styles.md#color), [`font`](../../references/document-sandbox/document-apis/interfaces/character-styles.md) ranges in the text content, controlling the [`color`](../../references/document-sandbox/document-apis/interfaces/character-styles.md#font), [`fontSize`](../../references/document-sandbox/document-apis/interfaces/character-styles.md) ranges in the text content, controlling the [`color`](../../references/document-sandbox/document-apis/interfaces/character-styles.md#fontsize), [`letterSpacing`](../../references/document-sandbox/document-apis/interfaces/character-styles.md) ranges in the text content, controlling the [`color`](../../references/document-sandbox/document-apis/interfaces/character-styles.md#letterSpacing) and [`underline`](../../references/document-sandbox/document-apis/interfaces/character-styles.md) ranges in the text content, controlling the [`color`](../../references/document-sandbox/document-apis/interfaces/character-styles.md#underline) properties.
          [AvailableFont](../../references/document-sandbox/document-apis/classes/available-font.md) and [UnavailableFont](../../references/document-sandbox/document-apis/classes/unavailable-font.md) classes.
          Supporting interfaces, enumerations and type aliases.
      - type: new
        text: "Added **Per Element Metadata APIs**: with this feature, add-ons can store private metadata to any node of the Express document. This metadata is accessible only to the add-on that has set it. See the [`AddOnData`](../../references/document-sandbox/document-apis/classes/add-on-data.md) class and the [`addOnData`](../../references/document-sandbox/document-apis/classes/base-node.md#addondata) accessor for the BaseNode class."
      - type: new
        text: "Added **Selection Change Notification Events APIs**: add-on can register to be notified when selection and properties in the selection changes on the document. The [`Context`](../../references/document-sandbox/document-apis/classes/context.md) class will expose two [`on()`](../../references/document-sandbox/document-apis/classes/context.md#on) and [`off()`](../../references/document-sandbox/document-apis/classes/context.md#off) methods which can be used to register and un-register selection change and selection properties change notifications."
      - type: new
        text: "Added a new [`GridCellNode`](../../references/document-sandbox/document-apis/classes/grid-cell-node.md) class that represents a **cell in a grid**."
      - type: new
        text: "**IMPORTANT:** This round of new APIs is currently **_experimental only_** with the exception of `TextNode.fullContent.text`, and should not be used in any add-ons you will be distributing until it has been declared stable. To use them, you will first need to set the `experimentalApis` flag to `true` in the [`requirements`](../../references/manifest/index.md#requirements) section of the `manifest.json`."
      - type: fixed
        text: "[`GridLayoutNode.allChildren`](../../references/document-sandbox/document-apis/classes/grid-layout-node.md#allchildren) does not include rectangle nodes."
      - type: deprecated
        text: "[`TextNode.text`](../../references/document-sandbox/document-apis/classes/text-node.md#text) is now deprecated; it is still working, but will be removed in a future update. Please use [`TextNode.fullContent.text`](../../references/document-sandbox/document-apis/classes/text-node.md#fullcontent) instead."

  - date: 2024-09-24
    changes:
      - text: "Adds a new [`addAnimatedImage()`](../../references/addonsdk/app-document.md#addanimatedimage) method which can be used to add **animated GIF** images to the document (as long as they fit within certain [technical constraints](../../references/addonsdk/app-document.md#image-requirements))."
      - text: "Adds a new [`importPdf()`](../../references/addonsdk/app-document.md#importpdf) method which can be used to import a PDF as a new Adobe Express document."
      - text: "Adds a new [`importPresentation()`](../../references/addonsdk/app-document.md#importpresentation) method which can be used to import a Powerpoint as a new Adobe Express document."
      - text: "Adds notes about specific support and handling for animated GIF images when [importing](../../references/addonsdk/app-document.md#addimage) and [dragging content](../../references/addonsdk/addonsdk-app.md#enabledragtodocument). This includes a [new FAQ item](../support/faq.md#are-animated-gifs-supported-when-importing-or-dragging-content-to-the-document) summarizing the associated use cases."
      - text: "Adds all of the new methods mentioned above to the [How-to](../learn/how-to/index.md) section with example code snippets for each."
      - text: "**IMPORTANT:** The [`importPdf()`](../../references/addonsdk/app-document.md#importpdf) and [`importPresentation()`](../../references/addonsdk/app-document.md#importpresentation) methods are currently **_experimental only_** and should not be used in any add-ons you will be distributing until it has been declared stable. To use this method, you will first need to set the `experimentalApis` flag to `true` in the [`requirements`](../../references/manifest/index.md#requirements) section of the `manifest.json`."

  - date: 2024-09-10
    changes:
      - text: "Added a new [`replaceMedia()`](../../references/document-sandbox/document-apis/classes/media-container-node.md#replacemedia) method to the `MediaContainerNode` class that can be used to replace existing media inline."
      - text: "Refactoring done to the [`Stroke`](../../references/document-sandbox/document-apis/interfaces/stroke.md) APIs."

  - date: 2024-07-22
    changes:
      - text: "Added a new [`format`](../../references/addonsdk/app-ui.md#format) property to the `addOnUISdk.app.ui` object that reflects the format used to display dates, times, numbers, etc. in the user's environment. It supports a [`\"formatchange\"`](../../references/addonsdk/app-ui.md#formatchange) event triggered when the format changes—see an example in the [Locale, Supported Locales, and Format](../learn/how-to/theme-locale.md) section."
      - text: "Removed `mobile` and `app` as [`supportedDeviceClass`](../../references/manifest/index.md#requirementsappssupporteddeviceclass) values in the Manifest's `requirements.apps` object."

  - date: 2024-05-28
    changes:
      - text: "Added a new _experimental_ [`openEditorPanel()`](../../references/addonsdk/app-ui.md#openeditorpanel) API to programmatically open and interact with the Editor panel. This method of the `addOnUISdk.app.ui` allows navigation to specific tabs and collections, as well as performing content searches. The [Constants](../../references/addonsdk/addonsdk-constants.md) page has been updated accordingly."
      - text: "Added a new [`Cross-Origin-Embedder-Policy`](../support/faq.md#how-do-i-prevent-my-iframe-content-from-being-blocked-due-to-cross-origin-issues) FAQ."

  - date: 2024-05-21
    changes:
      - text: "The [Quickstart](hello-world.md) and [Distribute](../build/distribute/index.md) guides have been updated to reflect major UI/UX improvements for in-app workflows, particularly around distribution and listing management."
      - text: "The Add-ons tab is now active also in the Adobe Express home page, regardless of whether a project is open or not."
      - text: "A new section on Marketplace [rejections](../build/distribute/rejections.md) has been added, highlighting the most common problems found during the add-on review process and how to avoid them."
      - text: "The [Manifest Reference](../../references/manifest/index.md) has been updated with two new permission properties: `microphone` and `camera`."

  - date: 2024-04-10
    changes:
      - text: "A new [`VisualNode`](../../references/document-sandbox/document-apis/classes/visual-node.md) class has been added to the Document APIs, and represents any node that can be visually perceived in the content."
      - text: "New Document APIs have been added:"
        list: |
          [`currentPage`](../../references/document-sandbox/document-apis/classes/express-context.md#currentpage) Context accessor: returns the active page.
          [`visualRoot`](../../references/document-sandbox/document-apis/classes/visual-node.md#visualroot) accessor: the highest ancestor that still has visual presence in the document—typically, an Artboard.
          [`cloneInPlace()`](../../references/document-sandbox/document-apis/classes/page-node.md#cloneinplace) method: clones a Page, all artboards within it, and all content within those artboards.
          Support to Bounds has been added in several classes: [`boundsInParent`](../../references/document-sandbox/document-apis/classes/node.md#boundsinparent); `boundsLocal` (for both [GroupNode](../../references/document-sandbox/document-apis/classes/group-node.md#boundslocal) and [VisualNode](../../references/document-sandbox/document-apis/classes/visual-node.md#boundslocal)); [`centerPointLocal`](../../references/document-sandbox/document-apis/classes/visual-node.md#centerpointlocal); [`topLeftLocal`](../../references/document-sandbox/document-apis/classes/visual-node.md#topleftlocal); [`boundsInNode()`](../../references/document-sandbox/document-apis/classes/node.md#boundsinnode); [`localPointInNode()`](../../references/document-sandbox/document-apis/classes/visual-node.md#localpointinnode);
      - text: "The CLI has been updated to release version `2.0.0`, and includes the following:"
        list: |
          Periodic login and EULA consent are no longer required.
          Two new templates for creating add-ons with built-in support to Spectrum Web Components have been added and documented: `swc-javascript` and `swc-javascript-with-document-sandbox`. Typescript templates have been renamed to `swc-typescript` and `swc-typescript-with-document-sandbox`. See [this page](../getting-started/local-development/dev-tooling.md#templates) for details on all the available templates.
          Typings have been updated to include the latest SDK changes, and other internal packages are now at version `2.0.0`.
      - text: "**NOTE:** The new version should be installed by default when you create a new add-on. If, for any reason, it doesn't, you can force it to install by clearing the `npx` cache first with `npx clear-npx-cache` or by specifying the version in the command, i.e.: `npx @adobe/create-ccweb-add-on@2.0.0 my-add-on`."
      - text: "The [Samples](../learn/samples.md) page has been updated to document the existing add-ons in the [`express-add-on-samples`](https://github.com/AdobeDocs/express-add-on-samples) repository, including a newly added [`audio-recording-addon`](../learn/samples.md#audio-recording-addon)."
      - text: "The [Common Use Cases](../learn/how-to/index.md) section has been refactored as a sub-menu, grouping similar topics into individual pages. A new [Login and Logout flows](../learn/how-to/oauth2.md#login-and-logout-flows) section has been added. Other minor fixes and improvements have been made to the documentation."

  - date: 2024-03-19
    changes:
      - text: "Support for Ps and Ai files to be added to the page via the [`addImage()`](../../references/addonsdk/app-document.md#addimage) method. (Note: there were no changes to the drag-n-drop APIs)."
      - text: "Adds new `MediaAttributes` parameter to the [`addImage()`](../../references/addonsdk/app-document.md#addimage) method for Ps/Ai file types to pass media attributes like `title`."
      - text: "Adds new [`Mp4RenditionOptions`](../../references/addonsdk/app-document.md#mp4renditionoptions) object to support `mp4` renditions."
      - text: "Adds new [`VideoResolution`](../../references/addonsdk/addonsdk-constants.md) constant to set video resolution options."
      - text: "Adds [`registerIframe()`](../../references/addonsdk/addonsdk-app.md#registeriframe) method and [`unregisterIframe`](../../references/addonsdk/addonsdk-app.md#unregisteriframe-type-definition) type definition with example usage. **NOTE:** These APIs are currently experimental."

  - date: 2024-03-08
    changes:
      - text: "[`getPagesMetadata()`](../../references/addonsdk/app-document.md#getpagesmetadata), [`startPremiumUpgradeIfFreeUser`](../../references/addonsdk/addonsdk-app.md#startpremiumupgradeiffreeuser) and [`isPremiumUser`](../../references/addonsdk/app-current-user.md#ispremiumuser) have been moved to stable and no longer require the `experimentalApis` flag to be set."
      - text: "New examples have been added to the [use cases guide](../learn/how-to/premium-content.md) for handling premium content."
      - text: "A new video has been added to the [grids tutorial](../learn/how-to/tutorials/grids-addon.md) to help guide developers in building the grids add-on."

  - date: 2024-02-21
    changes:
      - text: |
          New support for [monetization details](../build/distribute/public-dist.md#step-8-enter-the-monetization-details) has been added to the public distribution flow and allows you to [provide details around monetization options](../build/distribute/public-dist.md#step-8-enter-the-monetization-details) your add-on supports. A selection will now be required when you submit a new add-on to the marketplace or update an existing one. The options include _free_, _one-time payment_, _recurring subscription_, _micro-transactions_, and _other_.

          In addition, the [monetization guidelines](../build/distribute/guidelines/monetization.md) were updated with details to help guide you in communicating your monetization strategy, and include new branding [badges](../build/distribute/guidelines/monetization.md#branding-assets-for-monetization) you can use to visually indicate when content or features require a purchase or when they are paid and unlocked. Please ensure you review the [updated monetization guidelines](../build/distribute/guidelines/monetization.md) carefully for specific details. **NOTE:** Adobe does not currently provide a specific monetization feature, but with this update, provides a way for developers to communicate the monetization details of their add-ons.
      - text: "The first phase of add-on analytics support has been released, and allows developers to [download insights data](../build/distribute/public-dist.md#post-submission-details-and-insights) for their published add-ons via the [Download insights](../build/distribute/public-dist.md#post-submission-details-and-insights) button in the in-app distribution modal."
      - text: "A new [Concepts guide](../learn/platform-concepts/document-api.md) was added to the [Document APIs](../../references/document-sandbox/document-apis/index.md) section to provide a deep-dive into the architecture and key elements of the Adobe Express Document Object Model (DOM)."

  - date: 2024-02-14
    changes:
      - text: "A new `id` accessor has been added to the [`BaseNode`](../../references/document-sandbox/document-apis/classes/base-node.md) class in the Document APIs and is inherited by all classes that extend it. The `id` represents a unique identifier that stays the same when the file is closed and reopened, or if the node is moved to a different part of the document."

  - date: 2024-02-07
    changes:
      - text: "A new [`createPath`](../../references/document-sandbox/document-apis/classes/editor.md#createpath) method is now available for allowing you to create a path with the Document APIs."
      - text: "Updates descriptions in various methods and classes in the [Document APIs](../../references/document-sandbox/document-apis/index.md)."
      - text: "Updates to the [`createRenditions`](../../references/addonsdk/app-document.md#createrenditions) API, including a new [`print`](../../references/addonsdk/addonsdk-constants.md) option for `RenditionIntent` to be be used for generating a print optimized pdf, and an update to [`PdfRenditionOptions`](../../references/addonsdk/app-document.md#pdfrenditionoptions) which exposes the ability to customize each PDF Page Box's (`MediaBox`, `BleedBox`, `CropBox`, `TrimBox`) dimensions using a `pageBoxes` property."
      - text: "Updates to the [Using Adobe Spectrum tutorial](../learn/how-to/tutorials/spectrum-workshop/index.md) with additional details on [why you should use Spectrum CSS variables](../learn/how-to/tutorials/spectrum-workshop/part3.md#styling-with-spectrum-css) to style your add-ons, and [additional helpful guidelines for locating and using them](../learn/how-to/tutorials/spectrum-workshop/part3.md#layout-and-typography-styling)."
      - text: "The table of contents in each Document API class/interface/constant has been removed since it was a duplicate of the right side navigation menu."

  - date: 2024-01-31
    changes:
      - text: "Added a new tutorial - [Building UIs using Adobe's Spectrum Design System](../learn/how-to/tutorials/spectrum-workshop/index.md)."

  - date: 2024-01-09
    changes:
      - type: "new experimental apis"
        text: "[`startPremiumUpgradeIfFreeUser()`](../../references/addonsdk/addonsdk-app.md#startpremiumupgradeiffreeuser) experimental API has been added to the [addOnUISdk.app](../../references/addonsdk/addonsdk-app.md) object to display the in-app monetization upgrade flow and returns a value indicating whether the user upgraded to premium or not."
      - type: "new experimental apis"
        text: "[`isPremiumUser()`](../../references/addonsdk/app-current-user.md#ispremiumuser) experimental API has been added to the [addOnUISdk.app.currentUser](../../references/addonsdk/app-current-user.md) object to determine if the current user is a premium or free user."
      - type: "new experimental apis"
        text: "**IMPORTANT:** The above new APIs are currently **experimental only** and should not be used in any add-ons you will be distributing until declared stable. To use these APIs, you will first need to set the `experimentalApis` flag to `true` in the [`requirements`](../../references/manifest/index.md#requirements) section of the `manifest.json`."
      - type: improved
        text: "A new [`PdfRenditionOptions`](../../references/addonsdk/app-document.md#pdfrenditionoptions) object is now available to be used with the the [`createRenditions()` export API](../../references/addonsdk/app-document.md#createrenditions) and allows a user to specify an optional [bleed](../../references/addonsdk/app-document.md#bleed) object (for printing)."
      - type: improved
        text: "A new [`isPrintReady`](../../references/addonsdk/app-document.md#pagemetadata) property has been added to the [`PageMetadata` API](../../references/addonsdk/app-document.md#pagemetadata) to indicate if the page is ready to print."
      - type: improved
        text: "Updated the [FAQ](../support/faq.md#what-mime-type-is-returned-from-a-pdf-that-was-exported-with-the-createrenditions-method) regarding the mime type for exported PDF files. It will now return `application/pdf` (as opposed to `text/plain` from an earlier update)."

  - date: 2023-12-07
    changes:
      - type: breaking
        text: "Some items in the following list of changes may have been mentioned in recent updates but are being listed in this summary again to serve as a reminder."
      - type: breaking
        text: "The methods in the [Document API Editor class](../../references/document-sandbox/document-apis/classes/editor.md) to create a color fill and stroke have been renamed to [`makeColorFill`](../../references/document-sandbox/document-apis/classes/editor.md#makecolorfill) and [`makeStroke`](../../references/document-sandbox/document-apis/classes/editor.md#makestroke) respectively."
      - type: breaking
        text: "`strokes` and `fills` have been renamed to their singular counterpart. (Express does not support multiple strokes or fills). You should use `stroke` and `fill` going forward to access them, and they will no longer be `ItemList` objects, since they represent only a single stroke or fill."
        list: |
          `fill` and `stroke.color` are just a [color object](../../references/document-sandbox/document-apis/interfaces/color.md) of the form `{ red, green, blue, alpha }`.
          `stroke` is an object of the form `{ color, width, dashPattern, dashOffset }`
        code: |
          // Before
          rectangle.fills.append(rectFill);
          ellipse.fills.append(ellipseFill);

          // After
          rectangle.fill = rectFill;
          ellipse.fill = ellipseFill;
      - type: breaking
        text: "Color utilities have moved to [`colorUtils`](../../references/document-sandbox/document-apis/classes/color-utils.md) instead of `utils`."
        list: |
          `fromHex` returns a color from a Hex string -- e.g., `colorUtils.fromHex("#FF8040")` or `colorUtils.fromHex("#FF8040FF")` (including the optional alpha);
          `fromRGB` returns a color from a set of RGB(A) values (0-1) -- e.g., `colorUtils.fromRGB(1,0.5,0.25,1)`.
          `toHex` converts a color object to a Hex string -- e.g., `colorUtils.toHex(aColor)`.
        code: |
          import { utils } from "express-document-sdk";
          const color = utils.createColor(1, 0, 0);

          import { colorUtils } from "express-document-sdk";

          // any of:
          const color = colorUtils.fromRGB(1, 0, 0); // optional alpha
          const color = colorUtils.fromRGB({ red: 1 , green: 0, blue: 0 };); // optional alpha
          const color = colorUtils.fromHex("#ff0000");
          const color = { red: 1, green: 0, blue: 0, alpha: 1 }; // mandatory alpha
      - type: breaking
        text: "`allChildren` returns an `iterator`, not an `Array`. However if you want to use array methods (ie: `Array#map`), you can use `Array.from` to convert it to an array."
      - type: breaking
        text: "Strokes and fills will no longer _move_ if you add an existing `stroke`/`fill` to another shape (previously the original shape would lose the corresponding `stroke` or `fill`). For example:"
        code: |
          // Old way
          const greenFill = editor.createColorFill(colorUtils.fromRGB(0, 0, 1));
          someRect.fills.append(greenFill);
          anotherRect.fills.append(greenFill);
          /* oops, someRect no longer has a green fill, because anotherRect is its parent */

          // New way
          const greenFill = editor.makeColorFill(colorUtils.fromRGB(0, 0, 1));
          someRect.fill = greenFill;
          anotherRect.fill = greenFill;
          /* both rectangles have a green fill */
      - type: breaking
        text: "Some things that previously didn't make sense will now cause compile errors in typescript, or throw in javascript:"
        list: |
          Do not assume a node's parent is movable — e.g., an artboard can't be repositioned.
          Not all shapes support setting `opacity` or `locking` (e.g, the document root or an artboard).
      - type: breaking
        text: "The `translateX` and `translateY` properties have been replaced by a single translation object."
        code: |
          // old
          rectangle.translateX = 100;
          rectangle.translateY = 20;

          // new
          rectangle.translation = { x: 100, y: 20 }; // both x,y properties are required
      - type: breaking
        text: "A new [`BaseNode`](../../references/document-sandbox/document-apis/classes/base-node.md) class has been introduced, and [`ContainerNode`](../../references/document-sandbox/document-apis/interfaces/container-node.md) has been moved from a class to an interface."
      - type: breaking
        text: |
          The key to load APIs that use the Document APIs has changed, as well as the module names you import APIs from in the [Document Sandbox](../../references/document-sandbox/index.md). The old ones will still work, but the CLI and templates have all been updated to use the new names. Please update your add-ons to use the new ones shown below:

          **Adobe Express Document APIs SDK import**&lt;br /&gt;
          For access to the [Express document and content authoring APIs](../../references/document-sandbox/document-apis/index.md):
        code: |
          // Old
            import { editor } from "express";

          // New
          import { editor } from "express-document-sdk";
      - type: breaking
        text: |
          **Document Sandbox SDK import**&lt;br /&gt;
          For access to the [document sandbox runtime APIs](../../references/document-sandbox/index.md):
        code: |
          // Old
          import AddOnScriptSdk from "AddOnScriptSdk";

          // New
          import addOnSandboxSdk from "add-on-sdk-document-sandbox";
      - type: breaking
        text: "The [`manifest.json` entry point](../../references/manifest/index.md#entrypoints) for the document sandbox script code reference was renamed from `script` to `documentSandbox`, as shown below:"
        code: |
          "entryPoints": [
                {
                    "type": "panel",
                    "id": "panel1",
                    "main": "index.html",
                    "documentSandbox": "code.js" // used to be "script": "code.js"
                }
            ]
      - type: breaking
        text: "The [`apiProxy()`](../../references/addonsdk/instance-runtime.md#apiproxy) method in the [`addOnSandboxSdk.instance.runtime`](../../references/addonsdk/addonsdk-instance.md#objects) object now accepts `\"documentSandbox\"` as a parameter when referring to the entry point in the manifest where your document sandbox code resides, instead of `\"script\"`."
      - type: breaking
        text: "The [`RuntimeType`](../../references/addonsdk/addonsdk-constants.md) constant now uses the value of `\"documentSandbox\"` in lieu of `\"script\"`."
      - type: breaking
        text: "**IMPORTANT:** The above updates should be considered breaking changes, so any add-ons in development that relied on the experimental APIs may not work correctly until you make changes to use the new/updated ones above. The intention was to ensure these important changes were made prior to marking the APIs stable to 1) make them more intuitive for developers, 2) significantly improve the process of working with colors, strokes and fills, and 3) prevent certain operations from corrupting the document."
      - type: breaking
        text: "The CLI has been updated to release version `1.1.1`, and includes the following:"
        list: |
          The document sandbox templates have been updated to reflect all of the latest changes to the [Document Sandbox APIs](../../references/document-sandbox/index.md), and the `experimentalApis` flag has been removed. Please review the updated [references](../../references/document-sandbox/index.md) and changelog entries thoroughly for details on all of the recent changes. You may also want to refer to the [document sandbox code samples](https://github.com/AdobeDocs/express-add-on-samples/tree/main/document-sandbox-samples) for additional help on how to use them.
          Typings support has been added to the `javascript` templates to enable intellisense features.
          Manifest property additions.
          General improvements and bug fixes.
      - type: breaking
        text: "**NOTE:** The new version should be installed by default when you create a new add-on. If, for any reason, it doesn't, you can force it to install by clearing the npx cache first with `npx clear-npx-cache` or by specifying the version in the command, i.e.: `npx @adobe/create-ccweb-add-on@1.1.1 my-add-on`. You can update any existing add-ons to use this new version by updating the version of the `ccweb-add-on-scripts` in the `package.json` to `1.1.1`."
      - type: breaking
        text: "All [code samples](https://github.com/AdobeDocs/express-add-on-samples/tree/main/document-sandbox-samples) and the [Document API tutorial](../learn/how-to/tutorials/grids-addon.md) have also been updated to reflect all of the latest changes to the [Adobe Express Document Sandbox APIs](../../references/document-sandbox/document-apis/index.md) listed here."
      - type: breaking
        text: "Removed all experimental APIs notes/warnings around the **Document Sandbox** since they **are now stable**."
      - type: breaking
        text: "**Known Issue:** Please note, there is an edge case where **removing a page with your add-on** could potentially cause a problem where the UI needs to be reloaded. This will be resolved in the very near future, but please take caution and be aware that it would be best to avoid page removal in the short-term until it's resolved."
      - type: improved
        text: "A new `getPagesMetadata()` method is now available in the [Add-on UI SDK `document`](../../references/addonsdk/app-document.md#getpagesmetadata) object and includes an example code snippet. **NOTE:** This method is still considered **experimental only** and should not be used in any add-ons you will be distributing until it has been declared stable. To use this method, you will first need to set the `experimentalApis` flag to `true` in the [`requirements`](../../references/manifest/index.md#requirements) section of the `manifest.json`."
      - type: improved
        text: "The [`createRenditions()` export API](../../references/addonsdk/app-document.md#createrenditions) was updated with the following changes:"
        list: |
          You can now choose to generate renditions of specific pages via a new [`Range.specificPages`](../../references/addonsdk/addonsdk-constants.md) constant value.
          The returned type now also includes page metadata (see [`PageMetadata`](../../references/addonsdk/app-document.md#pagemetadata)) including useful information such as the id, page size, pixels per inch, and whether the page has premium or temporal (timeline) content or not, (in addition to the existing blob and title). An example is provided in the reference as well as in [the use cases](../learn/how-to/page-metadata.md).
      - type: improved
        text: "A new [document metadata use case example](../learn/how-to/document-metadata.md) has been added to show how to retrieve the [document id](../../references/addonsdk/app-document.md#id) and [title (ie: name)](../../references/addonsdk/app-document.md#title), including how to listen for the [associated events](../../references/addonsdk/addonsdk-app.md#events)."
      - type: improved
        text: "New tables have been added to the [Communication API reference](../../references/document-sandbox/communication/index.md) denoting the [supported](../../references/document-sandbox/communication/index.md#supported-data-types) and [unsupported data types](../../references/document-sandbox/communication/index.md#unsupported-data-types) that can be used across the [Communication API](../../references/document-sandbox/communication/index.md) layer."
      - text: "**BREAKING NEWS:** The [Adobe Express Document Sandbox](../../references/document-sandbox/index.md) and all associated APIs have been deemed stable, and **no longer require the `experimentalApis` flag**. As a result, some breaking changes with these experimental APIs were introduced before deeming them stable, and they are summarized below. Please read them thoroughly and update your in-development add-ons as needed. If you run into any issues, please reach out to us on our [Adobe Express Add-on Developer’s Discord channel](http://discord.gg/nc3QDyFeb4) for help."

  - date: 2023-12-04
    changes:
      - type: improved
        text: "The [Document API's](../../references/document-sandbox/document-apis/index.md) were updated to add a new [`ColorUtils`](../../references/document-sandbox/document-apis/classes/color-utils.md) class, which replaces the previous `utils` module that was used as a color helper with a more enhanced utlility. If you've used the old `utils` module in your add-ons, it will require you to update them to use the new named import of `colorUtils` instead of `utils`. Color creation should now be done using the new [`colorUtils` module](../../references/document-sandbox/document-apis/classes/color-utils.md). An example of the old way and new way to create a color are shown below for reference:"
        code: |
          // Before
          import { utils } from "express-document-sdk";
          const color = utils.createColor(1, 0, 0);

          // After
          import { colorUtils } from "express-document-sdk";

          // any of:
          const color = colorUtils.fromRGB(1, 0, 0); // optional alpha
          const color = colorUtils.fromRGB({ red: 1, green: 0, blue: 0 }); // optional alpha
          const color = colorUtils.fromHex("#ff0000");
          const color = { red: 1, green: 0, blue: 0, alpha: 1 }; // mandatory alpha
      - type: improved
        text: "The [code samples](https://github.com/AdobeDocs/express-add-on-samples/tree/main/document-sandbox-samples) have also been updated, so please also refer to those for further details on how to use it. Please note, the [example code snippets](../../references/document-sandbox/document-apis/index.md#example-code-snippet) and samples using `fills` or `strokes` off a node class were also updated to use a singular `Fill` or `Stroke` object instead of as an `ItemList` object."
        code: |
          // Before
          rectangle.fills.append(rectFill);
          ellipse.fills.append(ellipseFill);

          // After
          rectangle.fill = rectFill;
          ellipse.fill = ellipseFill;
      - type: improved
        text: |
          A new release has landed for the [**In-App Developer Submission experience**](../build/distribute/index.md) in Express. Some highlights from the release:

          **Create Add-on flow:** You can now create [an add-on "container"](../build/distribute/public-dist.md#step-2-add-on-listing-settings) as your first step in building add-ons within the existing in-app distribution workflow. Creating the container gets you access to a few important settings and data (for instance your unique subdomain, see below) before you continue the development process in the CLI. All existing add-ons will automatically receive a parent container with the associated additional features today.

          **Unique Subdomain retrieval:** As part of your add-on container, you will now be able to easily retrieve a unique subdomain for your add-on. Simply choose one of your add-ons in the distribution workflow and navigate to the new "Settings" tab and copy the Add-on URL. This URL is handy for addressing issues with CORS by adding the URL as an allowed origin. See [our CORS guide](../learn/platform-concepts/context.md#cors) for more details.

          **Delete Add-ons:** The "container" concept allowed us to offer better management and cleanup of your add-ons. You will now find the option to delete an add-on container entirely from the new "Settings" tab of a given add-on.
      - type: improved
        text: |
          **NOTE:** You can only delete add-ons that have not been published publicly or submitted to our Review team. Please contact us if you need to un-publish an add-on.

          **Supported Languages:** The [version details step](../build/distribute/public-dist.md#step-4-enter-listing-details) for publishing add-ons publicly now includes fields to indicate which languages are supported by your add-ons (beyond the required English). You can choose from any of the languages Express supports, and your designation will be shown to users when they browse your listing details. See [our sample for detecting a user's locale to localize your add-on](../learn/how-to/theme-locale.md).
      - type: improved
        text: "Updated list of templates and details to include the [Document Sandbox template options](./local-development/dev-tooling.md#templates), and how to still scaffold from one when the [`--template` parameter is not explicitly supplied](./local-development/dev-tooling.md#no-template-parameter)."
      - type: improved
        text: "New FAQ item regarding the mime type for exported PDF files. This is due to an unexpected change made in Adobe Express core to the mime type returned when you generate a PDF using the export [`createRenditions`](../../references/addonsdk/app-document.md#createrenditions) method. In the past it would return `application/pdf`, but currently it returns `text/plain`. This is something to be aware of if you are inspecting the mime type in the response and failing if it's anything other than `application/pdf`."
      - type: improved
        text: "Removed NPS survey."

